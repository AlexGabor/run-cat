<!DOCTYPE html>
<html lang="en">

<head>
    <title>Display a map</title>
    <meta property="og:description" content="Initialize a map in an HTML element with MapLibre GL JS." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap" rel="stylesheet">

    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.10.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.10.0/dist/maplibre-gl.js'></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: bisque;
            color: #9cd3b4;

            font-family: "Bowlby One SC", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 20px;
        }

        #content {
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            display: block;
            background-color: #fff;
            padding: 20px;
            padding-bottom: 20px;
        }

        #map {
            width: 400px;
            height: 400px;
            margin-bottom: 10px;
        }

        p {
            margin: 0;
            padding: 0;
        }

        .card-line {
            display: flex;
        }

        .loc {
            flex-grow: 1;
        }

        .date {
            font-size: 11px;
            line-height: 11px;
        }
    </style>
</head>

<body>
    <div id="content">
        <div class="card">
            <div id="map"></div>
            <div class="card-line">
                <span class="loc">Cluj-Napoca</span>
                <span class="dist">10k</span>
            </div>
            <div class="card-line">
                <span class="date">10.11.2025</span>
            </div>
        </div>
    </div>
    <script>
        const map = new maplibregl.Map({
            container: 'map', // container id
            style: 'http://127.0.0.1:3000/style/style.json', // style URL
            zoom: 14, // starting zoom
            attributionControl: false,
        });

        map.on('load', () => {
            map.addSource('route', {
                type: 'geojson',
                data: './activity_20775840672.geojson'
            })
            map.addLayer({
                'id': 'route',
                'type': 'line',
                'source': 'route',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#FF4100',
                    'line-width': 3
                }
            });
            const bounds = new maplibregl.LngLatBounds([23.6138173006475, 46.7588361818343], [23.6311327200383, 46.7671558912843])
            map.fitBounds(bounds, { padding: 30, animate: false })
        });

    </script>
</body>

</html>
