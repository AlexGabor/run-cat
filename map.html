<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display a map</title>
    <meta property="og:description" content="Initialize a map in an HTML element with MapLibre GL JS." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.10.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.10.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const map = new maplibregl.Map({
        container: 'map', // container id
        style: 'http://127.0.0.1:3000/style/style.json', // style URL
        center: [23.6215, 46.722], // starting position [lng, lat]
        zoom: 14, // starting zoom
    });

    map.on('load', () => {
    map.addSource('rpc', {
        type: 'vector',
        url: 'http://127.0.0.1:3000/tiles'
    });
    map.addLayer({
        'id': 'map',
        'type': 'fill',
        'source': 'rpc',
        'source-layer': 'building',
    });
});
</script>
</body>
</html>
